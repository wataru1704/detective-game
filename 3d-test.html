<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D試作（日本の夕暮れ街区）</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #aeb8b6; }
  #info {
    position: fixed; top: 10px; left: 10px; z-index: 10;
    color: #e8e6df; font-family: sans-serif; font-size: 13px;
    background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 6px;
  }
  #fps {
    position: fixed; top: 10px; right: 10px; z-index: 10;
    color: #f0c14b; font-family: sans-serif; font-size: 13px;
    background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 6px;
  }
  #visual-qa {
    position: fixed; left: 50%; bottom: 10px; z-index: 30;
    transform: translateX(-50%); white-space: nowrap;
    color: #e8f6ff; font: 12px/1.4 ui-monospace, monospace;
    background: rgba(5, 12, 17, 0.82); padding: 6px 10px; border-radius: 4px;
  }
  .visual-qa-mode #info,
  .visual-qa-mode #fps,
  .visual-qa-mode #joystick-base,
  .visual-qa-mode #btn-touch-interact { display: none; }

  /* バーチャルスティック（左下） */
  #joystick-base {
    position: fixed; left: 24px; bottom: 24px;
    width: 110px; height: 110px;
    border-radius: 50%;
    background: rgba(38,42,51,0.6);
    border: 1px solid rgba(61,66,80,0.9);
    touch-action: none;
    z-index: 10;
  }
  #joystick-knob {
    position: absolute; left: 50%; top: 50%;
    width: 48px; height: 48px;
    margin-left: -24px; margin-top: -24px;
    border-radius: 50%;
    background: rgba(201,79,79,0.85);
    pointer-events: none;
  }

  /* 調べるボタン（右下） */
  #btn-touch-interact {
    position: fixed; right: 28px; bottom: 36px;
    width: 90px; height: 90px;
    border-radius: 50%;
    background: rgba(201,79,79,0.85);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
    font-size: 0.9rem;
    touch-action: none;
    user-select: none;
    z-index: 10;
  }

  /* 縦画面のときは回転を促す案内を出す（スマホ想定） */
  #rotate-hint {
    display: none;
    position: fixed; inset: 0;
    z-index: 20;
    background: rgba(5,6,10,0.92);
    color: #e8e6df;
    align-items: center; justify-content: center;
    text-align: center;
    font-size: 1.1rem;
    padding: 24px;
  }
  @media (orientation: portrait) and (pointer: coarse) {
    #rotate-hint { display: flex; }
  }
</style>
</head>
<body>
<div id="info">矢印キー/WASDで移動、画面をドラッグで視点回転（日本の夕暮れ街区）</div>
<div id="fps">--- fps</div>

<div id="joystick-base">
  <div id="joystick-knob"></div>
</div>
<button id="btn-touch-interact">調べる</button>

<div id="rotate-hint">スマホを横向きにしてください 📱↻</div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module" src="js/3d-test.js?v=20260822m"></script>
</body>
</html>
